services:
  - type: web
    name: ecom-shop-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/manage.js indexes && node dist/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      # Test-only dependency; skip its MongoDB binary download on deploy hosts.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: BACKEND_API_KEY
        generateValue: true
